services:
  ml-server:
    build: .
    container_name: ml-server

    ports:
      - "8000:8000"

    env_file:
      - .env

    restart: unless-stopped

    command: >
      sh -c " if [ \"$$DB_ENGINE\" != \"none\" ] && [ -n \"$$DB_ENGINE\" ]; then python manage.py migrate; fi && python manage.py runserver 0.0.0.0:8000 "

    networks:
      - renal-care-net

networks:
  renal-care-net:
    external: true
    name: renal-care-management-system
